openapi: 3.0.0
info:
  title: MindHit API
  version: 0.0.0
tags: []
paths:
  /v1/sessions:
    get:
      operationId: Routes_list
      description: 세션 목록 조회
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionListResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/start:
    post:
      operationId: Routes_start
      description: 새 세션 시작
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}:
    get:
      operationId: Routes_get
      description: 세션 상세 조회
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
    put:
      operationId: Routes_update
      description: 세션 메타데이터 업데이트
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session.UpdateSessionRequest'
    delete:
      operationId: Routes_delete
      description: 세션 삭제
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/events:
    post:
      operationId: Routes_batchEvents
      description: 이벤트 배치 전송
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events.BatchEventsResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Events.BatchEventsRequest'
    get:
      operationId: Routes_listEvents
      description: 이벤트 목록 조회
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events.EventListResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/events/stats:
    get:
      operationId: Routes_getEventStats
      description: 이벤트 통계 조회
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Events.EventStatsResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/mindmap:
    get:
      operationId: MindmapRoutes_getMindmap
      description: 세션의 마인드맵 조회
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mindmap.MindmapResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/mindmap/generate:
    post:
      operationId: MindmapRoutes_generateMindmap
      description: 마인드맵 생성 요청
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mindmap.MindmapResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mindmap.GenerateMindmapRequest'
  /v1/sessions/{id}/pause:
    patch:
      operationId: Routes_pause
      description: 세션 일시정지
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/resume:
    patch:
      operationId: Routes_resume
      description: 세션 재개
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
  /v1/sessions/{id}/stop:
    post:
      operationId: Routes_stop
      description: 세션 종료
      parameters:
        - name: authorization
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session.SessionResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
components:
  schemas:
    Common.ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
          required:
            - message
      description: 기본 에러 응답
    Common.ValidationDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Common.ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/Common.ValidationDetail'
          required:
            - message
      description: 유효성 검증 에러
    Events.BatchEventsRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Events.EventData'
          minItems: 1
          maxItems: 100
          description: 이벤트 배열 (1-100개)
      description: 이벤트 배치 요청
    Events.BatchEventsResponse:
      type: object
      required:
        - processed
        - total
      properties:
        processed:
          type: integer
          format: int32
          description: 처리된 이벤트 수
        total:
          type: integer
          format: int32
          description: 총 이벤트 수
      description: 이벤트 배치 응답
    Events.EventData:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          type: string
          description: 이벤트 타입
        timestamp:
          type: integer
          format: int64
          description: 이벤트 발생 시간 (Unix timestamp ms)
        url:
          type: string
          description: 페이지 URL
        title:
          type: string
          description: 페이지 제목
        text:
          type: string
          description: 하이라이트 텍스트
        selector:
          type: string
          description: CSS 선택자
        color:
          type: string
          description: 하이라이트 색상
        note:
          type: string
          description: 사용자 노트
        metadata:
          type: string
          description: 추가 메타데이터 (JSON)
      description: 이벤트 데이터
    Events.EventListResponse:
      type: object
      required:
        - page_visits
        - highlights
        - total
      properties:
        page_visits:
          type: array
          items:
            $ref: '#/components/schemas/Events.PageVisit'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/Events.Highlight'
        total:
          type: integer
          format: int32
      description: 이벤트 목록 응답
    Events.EventStatsResponse:
      type: object
      required:
        - total_events
        - page_visits
        - highlights
        - unique_urls
      properties:
        total_events:
          type: integer
          format: int32
        page_visits:
          type: integer
          format: int32
        highlights:
          type: integer
          format: int32
        unique_urls:
          type: integer
          format: int32
      description: 이벤트 통계 응답
    Events.EventType:
      type: string
      enum:
        - page_visit
        - highlight
        - scroll
        - click
      description: 이벤트 타입
    Events.Highlight:
      type: object
      required:
        - id
        - text
        - color
        - created_at
      properties:
        id:
          type: string
        text:
          type: string
        selector:
          type: string
        color:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
      description: 하이라이트 정보
    Events.PageVisit:
      type: object
      required:
        - id
        - url
        - visited_at
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        visited_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int32
        summary:
          type: string
          description: AI 생성 요약
        keywords:
          type: array
          items:
            type: string
          description: AI 추출 키워드
        visit_count:
          type: integer
          format: int32
          description: 세션 내 방문 횟수
        total_duration_ms:
          type: integer
          format: int32
          description: 총 체류 시간 (ms)
      description: 페이지 방문 정보
    Mindmap.GenerateMindmapRequest:
      type: object
      properties:
        force:
          type: boolean
          description: 강제 재생성 여부
          default: false
      description: 마인드맵 생성 요청
    Mindmap.LayoutType:
      type: string
      enum:
        - galaxy
        - tree
        - radial
      description: 마인드맵 레이아웃 타입
    Mindmap.Mindmap:
      type: object
      required:
        - id
        - session_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/Mindmap.MindmapStatus'
        data:
          $ref: '#/components/schemas/Mindmap.MindmapData'
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 마인드맵 정보
    Mindmap.MindmapData:
      type: object
      required:
        - nodes
        - edges
        - layout
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Mindmap.MindmapNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Mindmap.MindmapEdge'
        layout:
          $ref: '#/components/schemas/Mindmap.MindmapLayout'
      description: 마인드맵 데이터
    Mindmap.MindmapEdge:
      type: object
      required:
        - source
        - target
        - weight
      properties:
        source:
          type: string
        target:
          type: string
        weight:
          type: number
          format: double
        label:
          type: string
      description: 마인드맵 엣지
    Mindmap.MindmapLayout:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        params:
          type: object
          additionalProperties: {}
      description: 마인드맵 레이아웃 설정
    Mindmap.MindmapNode:
      type: object
      required:
        - id
        - label
        - type
        - size
        - color
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        size:
          type: number
          format: double
        color:
          type: string
        position:
          $ref: '#/components/schemas/Mindmap.Position'
        data:
          type: object
          additionalProperties: {}
      description: 마인드맵 노드
    Mindmap.MindmapResponse:
      type: object
      required:
        - mindmap
      properties:
        mindmap:
          $ref: '#/components/schemas/Mindmap.Mindmap'
      description: 마인드맵 응답
    Mindmap.MindmapStatus:
      type: string
      enum:
        - pending
        - generating
        - completed
        - failed
      description: 마인드맵 상태
    Mindmap.NodeType:
      type: string
      enum:
        - core
        - topic
        - subtopic
        - page
      description: 마인드맵 노드 타입
    Mindmap.Position:
      type: object
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
      description: 3D 좌표
    Session.Session:
      type: object
      required:
        - id
        - session_status
        - started_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        session_status:
          $ref: '#/components/schemas/Session.SessionStatus'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: 세션 정보
    Session.SessionListResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session.Session'
      description: 세션 목록 응답
    Session.SessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/Session.Session'
      description: 세션 응답
    Session.SessionStatus:
      type: string
      enum:
        - recording
        - paused
        - processing
        - completed
        - failed
      description: 세션 상태
    Session.UpdateSessionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      description: 세션 업데이트 요청
servers:
  - url: http://localhost:8080
    description: Development server
    variables: {}
