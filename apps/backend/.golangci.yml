version: "2"

linters:
  enable:
    - misspell
    - gocritic
    - revive
  exclusions:
    rules:
      - path: ent/schema/
        linters:
          - revive
      - path: internal/generated/
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mindhit
