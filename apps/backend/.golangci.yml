version: "2"

linters:
  enable:
    - misspell
    - gocritic
    - revive
  settings:
    staticcheck:
      # QF* (quickfix) checks are editor-oriented style suggestions that the
      # previous golangci-lint v1 setup did not run; keep CI behavior stable.
      checks: ["all", "-QF*"]
  exclusions:
    rules:
      - path: ent/schema/
        linters:
          - revive
      - path: internal/generated/
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mindhit
